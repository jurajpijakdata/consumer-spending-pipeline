# Connection settings for dbt. No password: dbt uses your `az login` identity.
spending:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: sql-consumerspend-jp.database.windows.net
      port: 1433
      database: sqldb-consumerspend
      schema: dbt_dev
      authentication: CLI
      encrypt: true
      trust_cert: false
      threads: 4
